services:
  frontend:
    build: ./notifier-client
    container_name: notifier-client
    ports:
      - "3001:3001"
    networks:
      - notifier-network

  backend:
    build: ./notifier-server
    container_name: notifier-server
    env_file:
      - path: ./notifier-server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notifier?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - notifier-network

  postgres:
    image: postgres:latest
    container_name: notifier-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - notifier-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifier"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: notifier-redis
    ports:
      - "6379:6379"
    networks:
      - notifier-network

networks:
  notifier-network:
    driver: bridge

volumes:
  postgres-data: